name: Sync dev branch

permissions:
  contents: write

env:
  UPSTREAM_URL: "https://github.com/jeffvli/feishin.git"
  UPSTREAM_OWNER: "jeffvli"
  UPSTREAM_REPO: "feishin"
  DOWNSTREAM_OWNER: "thororen1234"
  DOWNSTREAM_REPO: "feishin"
  UPSTREAM_BRANCH: "development"
  DOWNSTREAM_BRANCH: "development"

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync upstream development
        uses: verticalsync/sync-upstream-repo@master
        with:
          upstream_repo: ${{ env.UPSTREAM_URL }}
          upstream_branch: ${{ env.UPSTREAM_BRANCH }}
          downstream_branch: ${{ env.DOWNSTREAM_BRANCH }}
          token: ${{ github.token }}

      - name: Get latest upstream release
        id: upstream_release
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}/releases/latest \
            > upstream_release.json

          tag=$(jq -r .tag_name upstream_release.json)
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Check if release already exists in fork
        id: check_release
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/${{ env.DOWNSTREAM_OWNER }}/${{ env.DOWNSTREAM_REPO }}/releases/tags/${{ steps.upstream_release.outputs.tag }})

          echo "status=$status" >> $GITHUB_OUTPUT

      - name: Create mirrored release in fork
        if: steps.check_release.outputs.status != '200'
        run: |
          title=$(jq -r .name upstream_release.json)
          body=$(jq -r .body upstream_release.json)

          curl -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ env.DOWNSTREAM_OWNER }}/${{ env.DOWNSTREAM_REPO }}/releases \
            -d @- <<EOF
          {
            "tag_name": "${{ steps.upstream_release.outputs.tag }}",
            "name": "$title",
            "body": "$body",
            "draft": false,
            "prerelease": false
          }
          EOF
